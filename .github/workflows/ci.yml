name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Tests and the reproducible Windows build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.7" # pinned: the same source must always give the same file
          cache-dependency-path: go.sum
      - name: Format, vet, tests
        run: |
          test -z "$(gofmt -l .)" || (gofmt -l . && echo "Run gofmt -w ." && exit 1)
          go vet ./...
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go vet ./...
          go test ./...
      - name: The build matches RELEASE byte for byte
        run: sh build.sh /tmp/FameAndFortuneUploader.exe
      - name: The same file builds in a clean Alpine Go image
        run: docker run --rm -v "$PWD:/src" -w /src golang:1.24.7-alpine sh build.sh /tmp/u.exe
